# M0a renderer spike: how long does it take a CI runner to get the Pulse Node
# runtime (download + extract vs actions/cache restore vs npm ci) and to build
# the synthetic site at a few sizes? Manual only; never part of CI or release.
#
# Findings go to .context/PULSE_RENDERER_SPIKE.md.
name: pulse-spike

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Space-separated page counts to build'
        default: '500 5000 20000'
      runtime_base_url:
        description: >-
          URL prefix hosting pulse-runtime-<platform>-<arch>.tar.zst (e.g. a draft
          release). Empty = build the tarball in the `runtime` job and pass it as an artifact.
        default: ''
      npm_ci_baseline:
        description: 'Also time a plain `npm ci` (the path the runtime tarball replaces)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pulse-spike-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Build runtime (${{ matrix.os }})
    if: inputs.runtime_base_url == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'
      - name: Build pruned runtime tarball
        run: pulse-template/scripts/build-runtime.sh "$RUNNER_TEMP/rt"
      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pulse-runtime-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rt/*.tar.zst
            ${{ runner.temp }}/rt/runtime-stats.json
          compression-level: 0  # already zstd -19
          retention-days: 3

  measure:
    name: Measure (${{ matrix.os }})
    needs: [runtime]
    if: always() && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            time_bin: /usr/bin/time
          - os: ubuntu-24.04-arm
            time_bin: /usr/bin/time
          - os: macos-15
            time_bin: /usr/bin/time   # BSD time -l; bench.sh detects it
          - os: windows-2022
            time_bin: none            # wall clock only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24'

      - name: Tooling
        run: |
          # (the runner context is not available in job-level env)
          echo "RESULTS=$RUNNER_TEMP/results" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/results"
          if [[ "$RUNNER_OS" == Linux && ! -x /usr/bin/time ]]; then sudo apt-get install -y time; fi
          zstd --version
          tar --version | head -1
          echo "PLATFORM=$(node -p 'process.platform + "-" + process.arch')" >>"$GITHUB_ENV"
          echo "CORES=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >>"$GITHUB_ENV"
          echo "now() { node -p 'Date.now()/1000'; }" >"$RUNNER_TEMP/now.sh"

      # --- A: download + extract (what `rfx pulse` does on a cold machine) ----------------
      - name: 'A: fetch tarball from URL'
        if: inputs.runtime_base_url != ''
        env:
          BASE_URL: ${{ inputs.runtime_base_url }}
        run: |
          . "$RUNNER_TEMP/now.sh"; t0=$(now)
          curl -fsSL -o "$RUNNER_TEMP/rt.tar.zst" "$BASE_URL/pulse-runtime-$PLATFORM.tar.zst"
          t1=$(now)
          echo "download_s=$(node -p "($t1-$t0).toFixed(2)")" >>"$RESULTS/acquire.env"
      - name: 'A: fetch tarball from artifact'
        if: inputs.runtime_base_url == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pulse-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/artifact
      - name: 'A: artifact timing note'
        if: inputs.runtime_base_url == ''
        run: |
          mv "$RUNNER_TEMP"/artifact/*.tar.zst "$RUNNER_TEMP/rt.tar.zst"
          cp "$RUNNER_TEMP/artifact/runtime-stats.json" "$RESULTS/" || true
          # The artifact download is timed by the step itself (see the job log); it is not
          # representative of a GitHub release / CDN download, so prefer runtime_base_url.
          echo "download_s=null" >>"$RESULTS/acquire.env"
      - name: 'A: extract'
        run: |
          . "$RUNNER_TEMP/now.sh"
          mkdir -p "$RUNNER_TEMP/rt"
          t0=$(now)
          zstd -d -q -c "$RUNNER_TEMP/rt.tar.zst" | tar -C "$RUNNER_TEMP/rt" -xf -
          t1=$(now)
          echo "tarball_bytes=$(node -p "require('fs').statSync(process.argv[1]).size" "$RUNNER_TEMP/rt.tar.zst")" >>"$RESULTS/acquire.env"
          echo "extract_s=$(node -p "($t1-$t0).toFixed(2)")" >>"$RESULTS/acquire.env"

      # --- B: actions/cache restore of the extracted tree ---------------------------------
      - name: 'B: mark cache start'
        run: echo "CACHE_T0=$(node -p 'Date.now()/1000')" >>"$GITHUB_ENV"
      - name: 'B: restore extracted runtime'
        id: rtcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/rt-cached/node_modules
          key: pulse-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pulse-template/package-lock.json', 'pulse-template/scripts/prune.mjs') }}
      - name: 'B: record cache timing'
        run: |
          t1=$(node -p 'Date.now()/1000')
          echo "cache_hit=${{ steps.rtcache.outputs.cache-hit == 'true' }}" >>"$RESULTS/acquire.env"
          echo "cache_restore_s=$(node -p "($t1-$CACHE_T0).toFixed(2)")" >>"$RESULTS/acquire.env"
          if [[ "${{ steps.rtcache.outputs.cache-hit }}" != true ]]; then
            mkdir -p "$RUNNER_TEMP/rt-cached"
            cp -R "$RUNNER_TEMP/rt/node_modules" "$RUNNER_TEMP/rt-cached/"
          fi
      - name: 'B: save cache (first run only)'
        if: steps.rtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/rt-cached/node_modules
          key: pulse-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pulse-template/package-lock.json', 'pulse-template/scripts/prune.mjs') }}

      # --- C: baseline npm ci -----------------------------------------------------------
      - name: 'C: npm ci baseline'
        if: inputs.npm_ci_baseline
        run: |
          . "$RUNNER_TEMP/now.sh"
          mkdir -p "$RUNNER_TEMP/npmci"
          cp pulse-template/package.json pulse-template/package-lock.json "$RUNNER_TEMP/npmci/"
          t0=$(now)
          (cd "$RUNNER_TEMP/npmci" && npm ci --ignore-scripts --omit=dev --no-audit --no-fund --loglevel=error)
          t1=$(now)
          echo "npm_ci_s=$(node -p "($t1-$t0).toFixed(2)")" >>"$RESULTS/acquire.env"

      # --- Build benchmarks (runtime from A) ----------------------------------------------
      - name: Build benchmarks
        env:
          PAGES: ${{ inputs.pages }}
          TIME_BIN: ${{ matrix.time_bin }}
        run: |
          for n in $PAGES; do
            echo "::group::N=$n"
            pulse-template/scripts/bench.sh "$RUNNER_TEMP/rt" "$n" || echo "bench N=$n failed"
            cp "$RUNNER_TEMP/rt/results/"bench-$n*.json "$RESULTS/" 2>/dev/null || true
            cp "$RUNNER_TEMP/rt/results/"bench-$n-*.log "$RESULTS/" 2>/dev/null || true
            rm -rf "$RUNNER_TEMP/rt/sites/bench-$n"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} ($CORES cores, $PLATFORM)"
            echo '```'
            cat "$RESULTS/acquire.env" 2>/dev/null || true
            echo '```'
            echo '| pages | cold wall s | cold RSS MiB | warm wall s | warm RSS MiB | dist MB | avg HTML KB |'
            echo '| ---: | ---: | ---: | ---: | ---: | ---: | ---: |'
            for f in "$RESULTS"/bench-[0-9]*.json; do
              [[ -f "$f" && "$f" != *-cold* && "$f" != *-warm* ]] || continue
              node -e '
                const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const mb = (kb) => (kb == null ? "n/a" : (kb / 1024).toFixed(0));
                console.log(`| ${r.pages} | ${r.cold.wall_s} | ${mb(r.cold.max_rss_kb)} | ${r.warm.wall_s} | ${mb(r.warm.max_rss_kb)} | ${(r.sizes.distBytes / 1e6).toFixed(1)} | ${(r.sizes.avgHtmlBytes / 1024).toFixed(0)} |`);
              ' "$f"
            done
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pulse-spike-results-${{ matrix.os }}
          path: ${{ runner.temp }}/results
          retention-days: 14
